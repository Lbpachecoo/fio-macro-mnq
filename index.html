<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0b0f14" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="FIO MACRO" />
<title>FIO MACRO · MNQ</title>
<style>
:root{--bg:#0b0f14;--panel:#121821;--line:#1e2a38;--text:#e7eef6;--muted:#8aa0b5;--red:#ff4d4f;--green:#22c55e;--amber:#f5b942;--high:#ff4d4f;--med:#f5b942;--low:#64748b}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,system-ui,sans-serif}body{padding:10px 10px 28px}
header{display:flex;justify-content:space-between;gap:8px;margin-bottom:10px}h1{font-size:15px;letter-spacing:.14em;margin:0}
.sub,.clock span,.status,.t,.tm,.nums,.warn{color:var(--muted)}
.clock{text-align:right;font-variant-numeric:tabular-nums}.clock b{display:block;font-size:16px}.clock span{font-size:11px}
.banner{background:#2a1c0a;border:1px solid #5a3b12;color:#ffd089;padding:8px 10px;font-size:12px;border-radius:8px;margin-bottom:10px}
.grid{display:grid;gap:10px}.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.hd{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;border-bottom:1px solid var(--line);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.hd button,button{background:#1b2633;color:var(--text);border:1px solid #2b3b4d;border-radius:6px;padding:5px 8px;font-size:11px}
.next{padding:10px}.next .when{color:var(--amber);font-size:12px}.next .name{font-size:18px;font-weight:700;margin:4px 0}
.bias{margin-top:8px;padding:8px;border-radius:8px;font-size:13px;font-weight:700}
.bias.alta{background:#102616;color:var(--green);border:1px solid #1f6a38}
.bias.baixa{background:#2a1012;color:var(--red);border:1px solid #7a2228}
.bias.neutro{background:#1b1f26;color:var(--muted);border:1px solid var(--line)}
.tape{max-height:58vh;overflow:auto}.row{padding:8px 10px;border-bottom:1px solid #182230;font-size:13px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}.dot.H{background:var(--high)}.dot.M{background:var(--med)}.dot.L{background:var(--low)}
.tag{font-size:10px;padding:1px 6px;border-radius:99px;border:1px solid #314155;margin-left:6px}.tag.alta{color:var(--green)}.tag.baixa{color:var(--red)}
a{color:#9ecbff;text-decoration:none}
.cal .ev{display:grid;grid-template-columns:62px 1fr;gap:6px;padding:8px 10px;border-bottom:1px solid #182230;font-size:12px}
.form{padding:10px;display:grid;gap:8px}textarea{width:100%;min-height:72px;background:#0d131b;color:var(--text);border:1px solid #2b3b4d;border-radius:8px;padding:8px;font-size:14px}
.warn{font-size:11px;padding:8px 10px 12px;line-height:1.4;color:#f5b942}
</style></head><body>
<header><div><h1>FIO MACRO · MNQ</h1><div class="sub">Calendário + fio + viés de surpresa</div></div>
<div class="clock"><b id="clk">--:--:--</b><span>horário de Nova York</span></div></header>
<div class="banner" id="banner">Carregando…</div>
<div class="grid">
<section class="card"><div class="hd">Fio ao vivo <button id="btnNews">Atualizar</button></div>
<div class="status" id="newsStatus">CNBC · Fed</div><div class="tape" id="tape"></div></section>
<div>
<section class="card"><div class="hd">Próximo impacto MNQ</div><div class="next" id="nextBox">aguardando…</div></section>
<section class="card" style="margin-top:10px"><div class="hd">Colar print</div>
<div class="form"><textarea id="paste" placeholder="US CORE PCE M/M ACTUAL 0.3 (FORECAST 0.2)"></textarea>
<button id="btnParse">Classificar MNQ</button><div id="parseOut"></div></div></section>
<section class="card" style="margin-top:10px"><div class="hd">Calendário <button id="btnCal">Atualizar</button></div>
<div class="cal" id="cal"></div><div class="status" id="calStatus"></div></section>
</div></div>
<div class="warn">Não é o Financial Juice. Não executa ordem. Print no segundo 0 ainda é fio pago. Regra: número vs forecast.</div>
<script>
const TZ="America/New_York";
const fmtTime=d=>new Intl.DateTimeFormat("pt-BR",{timeZone:TZ,hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:false}).format(d);
const fmtHM=d=>new Intl.DateTimeFormat("en-GB",{timeZone:TZ,hour:"2-digit",minute:"2-digit",hour12:false,weekday:"short",month:"short",day:"2-digit"}).format(d);
function tickClock(){document.getElementById("clk").textContent=fmtTime(new Date())+" ET"}setInterval(tickClock,1000);tickClock();
const RULES=[{re:/core pce|pce price|pce/i,hawkIfBeat:true,label:"PCE"},{re:/cpi|consumer price/i,hawkIfBeat:true,label:"CPI"},{re:/average hourly|earnings/i,hawkIfBeat:true,label:"WAGES"},{re:/nonfarm|payroll|nfp|adp/i,hawkIfBeat:true,label:"EMPREGO"},{re:/unemployment rate(?! u6)/i,hawkIfBeat:false,label:"DESEMPREGO"},{re:/jobless claims|initial claims/i,hawkIfBeat:false,label:"CLAIMS"},{re:/jolts|job openings/i,hawkIfBeat:true,label:"JOLTS"},{re:/gdp/i,hawkIfBeat:true,label:"GDP"},{re:/fomc|powell|hike|higher for longer/i,hawkIfBeat:true,label:"FED"},{re:/oil|crude|hormuz|iran|brent/i,hawkIfBeat:true,label:"PETROLEO"}];
function numify(v){if(v===null||v===undefined||v==="")return null;if(typeof v==="number")return v;const n=parseFloat(String(v).replace(/[,%kK]/g,""));return Number.isFinite(n)?n:null}
function surpriseBias(name,actual,forecast){const a=numify(actual),f=numify(forecast);if(a==null||f==null)return{side:"neutro",reason:"sem actual vs forecast",conf:.2,fade:false};const rule=RULES.find(r=>r.re.test(name))||{hawkIfBeat:true,label:"MACRO"};if(a===f)return{side:"neutro",reason:rule.label+" inline",conf:.35,fade:false};const beat=a>f;const hawk=beat?rule.hawkIfBeat:!rule.hawkIfBeat;return{side:hawk?"baixa":"alta",reason:rule.label+(beat?" acima":" abaixo")+(hawk?" → MNQ BAIXA":" → MNQ ALTA"),conf:.78,fade:true}}
function headlineBias(text){const t=text.toLowerCase();const parsed=t.match(/actual\s+([-\d.]+).*(forecast|consenso)\s+([-\d.]+)/i);if(/actual/.test(t)&&parsed)return surpriseBias(text,parsed[1],parsed[3]);if(/hormuz|iran|oil spike|brent/.test(t))return{side:"baixa",reason:"geo/petróleo risk-off",conf:.55,fade:true};if(/dovish|rate cut|cpi miss|pce miss/.test(t))return{side:"alta",reason:"leitura dovish",conf:.5,fade:true};if(/hawkish|hot inflation|higher for longer/.test(t))return{side:"baixa",reason:"leitura hawkish",conf:.5,fade:true};return{side:"neutro",reason:"qualitativo — não operar como print",conf:.25,fade:false}}
const tag=s=>`<span class="tag ${s}">MNQ ${s.toUpperCase()}</span>`;
async function viaRss(url){const r=await fetch("https://api.rss2json.com/v1/api.json?rss_url="+encodeURIComponent(url));const j=await r.json();if(j.status!=="ok")throw 0;return (j.items||[]).map(it=>({t:new Date(it.pubDate||Date.now()),title:it.title||"",link:it.link||"#",src:(j.feed&&j.feed.title)||"RSS"}))}
const FEEDS=["https://www.cnbc.com/id/100003114/device/rss/rss.html","https://www.federalreserve.gov/feeds/press_all.xml"];
const SEED=[{t:new Date(),title:"NFP sex 02/10 08:30 ET consenso 52k (ant. 162k)",src:"CAL",link:"#"},{t:new Date(),title:"Core PCE qua 30/09 08:30 ET cons. 0.2",src:"CAL",link:"#"}];
function renderTape(items){document.getElementById("tape").innerHTML=items.slice(0,80).map(it=>{const b=headlineBias(it.title);const lvl=b.conf>=.7?"H":b.conf>=.45?"M":"L";return `<div class="row"><div class="t">${fmtHM(it.t)} · ${it.src}</div><div><span class="dot ${lvl}"></span><a href="${it.link}">${it.title}</a>${tag(b.side)}</div></div>`}).join("")}
async function loadNews(){let items=[...SEED],ok=0;for(const f of FEEDS){try{items=items.concat(await viaRss(f));ok++}catch(e){}}items.sort((a,b)=>b.t-a.t);renderTape(items);document.getElementById("newsStatus").textContent=ok?ok+" fontes vivas":"modo reserva"}
function rel(ev){return ev.countryCode==="US"||/lagarde|ecb|gdp|cpi|pce|payroll|claims|fomc|jolts|confidence|oil/i.test(ev.name||"")}
function renderCal(events){const now=Date.now();const list=events.filter(rel).sort((a,b)=>new Date(a.time)-new Date(b.time));const up=list.filter(e=>new Date(e.time)-now>=-15*60*1000);const focus=up[0]||list[list.length-1];if(focus){const b=surpriseBias(focus.name,focus.actual,focus.forecast);const when=new Date(focus.time);const mins=Math.round((when-now)/60000);const eta=mins>0?`em ${Math.floor(mins/60)}h ${Math.abs(mins%60)}m`:mins>-20?"NO AR":"já saiu";document.getElementById("nextBox").innerHTML=`<div class="when">${fmtHM(when)} ET · ${eta} · ${focus.countryCode}</div><div class="name">${focus.name}</div><div class="meta">A ${focus.actual??"—"} · F ${focus.forecast??"—"} · P ${focus.previous??"—"}</div><div class="bias ${b.side}">MNQ ${b.side.toUpperCase()} · ${b.reason}</div>`;document.getElementById("banner").textContent=`Próximo: ${focus.name} ${fmtHM(when)} ET`;}document.getElementById("cal").innerHTML=list.slice(0,36).map(ev=>{const b=surpriseBias(ev.name,ev.actual,ev.forecast);return `<div class="ev"><div class="tm">${fmtHM(new Date(ev.time))}<br><span class="dot ${ev.importance==="high"?"H":"M"}"></span>${ev.countryCode}</div><div><b>${ev.name}</b>${tag(b.side)}<div class="nums">A ${ev.actual??"—"} · F ${ev.forecast??"—"} · P ${ev.previous??"—"}</div></div></div>`}).join("")}
async function loadCal(){let data=null;try{const r=await fetch("https://biquote.io/api/calendar?countries=US,EU,GB&from=2026-09-28&to=2026-10-04");data=await r.json()}catch(e){}if(!Array.isArray(data)||!data.length){data=[{time:"2026-09-29T14:00:00Z",countryCode:"US",importance:"high",name:"JOLTS Job Openings",actual:null,forecast:7.106,previous:7.271},{time:"2026-09-30T12:30:00Z",countryCode:"US",importance:"high",name:"Core PCE Price Index m/m",actual:null,forecast:0.2,previous:0.2},{time:"2026-10-01T12:30:00Z",countryCode:"US",importance:"high",name:"Initial Jobless Claims",actual:null,forecast:192,previous:197},{time:"2026-10-02T12:30:00Z",countryCode:"US",importance:"high",name:"Nonfarm Payrolls",actual:null,forecast:52,previous:162},{time:"2026-10-02T12:30:00Z",countryCode:"US",importance:"high",name:"Unemployment Rate",actual:null,forecast:4.1,previous:4.1},{time:"2026-10-02T12:30:00Z",countryCode:"US",importance:"high",name:"Average Hourly Earnings m/m",actual:null,forecast:0.3,previous:0.3}];document.getElementById("calStatus").textContent="calendário local"}else document.getElementById("calStatus").textContent=data.length+" eventos";renderCal(data)}
document.getElementById("btnNews").onclick=loadNews;document.getElementById("btnCal").onclick=loadCal;
document.getElementById("btnParse").onclick=()=>{const t=document.getElementById("paste").value.trim();if(!t)return;const b=headlineBias(t);document.getElementById("parseOut").innerHTML=`<div class="bias ${b.side}">MNQ ${b.side.toUpperCase()} · ${(b.conf*100)|0}% · ${b.reason}</div>`};
loadCal();loadNews();setInterval(loadNews,180000);setInterval(loadCal,180000);
</script></body></html>
