<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/><meta name="theme-color" content="#0b0f14"/><meta name="apple-mobile-web-app-capable" content="yes"/><meta name="apple-mobile-web-app-title" content="FIO MACRO"/><link rel="manifest" href="./manifest.json"/><title>FIO MACRO</title>
<style>:root{--bg:#0b0f14;--panel:#121821;--line:#1e2a38;--text:#e7eef6;--muted:#8aa0b5;--red:#ff4d4f;--green:#22c55e;--amber:#f5b942}*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,system-ui,sans-serif}body{padding:10px}header{display:flex;justify-content:space-between;gap:8px}h1{font-size:15px;margin:0;letter-spacing:.12em}.clock{text-align:right}.clock b{display:block;font-size:16px}.sub,.status,.warn,.nums{color:var(--muted);font-size:11px}.banner{background:#2a1c0a;border:1px solid #5a3b12;color:#ffd089;padding:8px;border-radius:8px;margin:10px 0;font-size:12px}.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;margin-bottom:10px}.hd{display:flex;justify-content:space-between;padding:8px 10px;border-bottom:1px solid var(--line);font-size:11px;color:var(--muted);text-transform:uppercase}button{background:#1b2633;color:var(--text);border:1px solid #2b3b4d;border-radius:6px;padding:6px 8px}.next,.form{padding:10px}.bias{margin-top:8px;padding:8px;border-radius:8px;font-weight:700}.bias.alta{background:#102616;color:var(--green)}.bias.baixa{background:#2a1012;color:var(--red)}.bias.neutro{background:#1b1f26;color:var(--muted)}.tape{max-height:40vh;overflow:auto}.row{padding:8px 10px;border-bottom:1px solid #182230;font-size:13px}textarea{width:100%;min-height:64px;background:#0d131b;color:var(--text);border:1px solid #2b3b4d;border-radius:8px}</style></head><body>
<header><div><h1>FIO MACRO · MNQ</h1><div class="sub">Toque Ativar som uma vez por sessão</div></div>
<div class="clock"><b id="clk">--</b><button id="btnSound">Ativar som</button></div></header>
<div class="banner" id="banner">Som desligado até você tocar o botão</div>
<div class="card"><div class="hd">Próximo impacto</div><div class="next" id="nextBox">…</div></div>
<div class="card"><div class="hd">Colar print</div><div class="form"><textarea id="paste" placeholder="ACTUAL 0.3 FORECAST 0.2"></textarea><p><button id="btnParse">Classificar</button></p><div id="parseOut"></div></div></div>
<div class="card"><div class="hd">Fio <button id="btnNews">Atualizar</button></div><div class="tape" id="tape"></div></div>
<div class="card"><div class="hd">Calendário <button id="btnCal">Atualizar</button></div><div id="cal"></div><div class="status" id="calStatus"></div></div>
<div class="warn">Offline = casco do app. Fio/calendário vivo precisa de rede. Switch do iPhone não pode estar laranja.</div>
<script>
const TZ="America/New_York";
const fmtTime=d=>new Intl.DateTimeFormat("pt-BR",{timeZone:TZ,hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:false}).format(d);
const fmtHM=d=>new Intl.DateTimeFormat("en-GB",{timeZone:TZ,hour:"2-digit",minute:"2-digit",hour12:false,weekday:"short",day:"2-digit",month:"short"}).format(d);
setInterval(()=>document.getElementById("clk").textContent=fmtTime(new Date())+" ET",1000);
let audioCtx=null,soundOn=false,EVENTS=[],beepDone=new Set();
function unlockSound(){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;audioCtx=audioCtx||new AC();audioCtx.resume();soundOn=true;document.getElementById("btnSound").textContent="Som ligado";beep(880,.12,.08)}
function beep(f,d,v){if(!soundOn||!audioCtx)return;const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type="square";o.frequency.value=f;g.gain.value=v;o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+d)}
function alertNow(k){if(k==="t5"){beep(660,.18,.09);setTimeout(()=>beep(660,.18,.09),220)}else if(k==="t1"){beep(880,.2,.1);setTimeout(()=>beep(988,.25,.1),200)}else{beep(523,.15,.1);setTimeout(()=>beep(784,.35,.12),160);setTimeout(()=>beep(1046,.4,.12),360)}}
function watch(){if(!soundOn)return;const now=Date.now();for(const ev of EVENTS){if(String(ev.importance)!=="high")continue;const mins=(new Date(ev.time)-now)/60000;const key=ev.name+ev.time;if(mins<=5&&mins>4.4&&!beepDone.has(key+":5")){beepDone.add(key+":5");alertNow("t5")}if(mins<=1&&mins>.4&&!beepDone.has(key+":1")){beepDone.add(key+":1");alertNow("t1")}if(mins<=.08&&mins>-.4&&!beepDone.has(key+":0")){beepDone.add(key+":0");alertNow("t0")}}}
setInterval(watch,4000);
function numify(v){if(v==null||v==="")return null;const n=parseFloat(String(v).replace(/[,%kK]/g,""));return Number.isFinite(n)?n:null}
const RULES=[{re:/pce|cpi/i,h:1},{re:/payroll|nfp|adp|hourly|jolts/i,h:1},{re:/unemployment rate(?! u6)|claims/i,h:0},{re:/oil|iran|hormuz/i,h:1}];
function surprise(name,a,f){a=numify(a);f=numify(f);if(a==null||f==null)return{side:"neutro",reason:"aguardando print"};if(a===f)return{side:"neutro",reason:"inline"};const rule=RULES.find(r=>r.re.test(name))||{h:1};const hawk=a>f?rule.h:!rule.h;return{side:hawk?"baixa":"alta",reason:(a>f?"acima":"abaixo")+" do consenso"}}
function headlineBias(t){const p=t.toLowerCase().match(/actual\s+([-\d.]+).*(forecast|consenso)\s+([-\d.]+)/i);if(p)return surprise(t,p[1],p[3]);if(/hormuz|iran|oil/.test(t.toLowerCase()))return{side:"baixa",reason:"geo"};return{side:"neutro",reason:"qualitativo"}}
async function loadNews(){let items=[];try{const r=await fetch("https://api.rss2json.com/v1/api.json?rss_url="+encodeURIComponent("https://www.cnbc.com/id/100003114/device/rss/rss.html"));const j=await r.json();items=(j.items||[]).map(i=>({t:new Date(i.pubDate),title:i.title,link:i.link}))}catch(e){}document.getElementById("tape").innerHTML=(items.slice(0,20).map(i=>`<div class="row">${fmtHM(i.t)} · ${i.title}</div>`).join("")||"sem fio")}
async function loadCal(){let data=[];try{const r=await fetch("https://biquote.io/api/calendar?countries=US&from=2026-09-28&to=2026-10-04");data=await r.json()}catch(e){}if(!Array.isArray(data)||!data.length)data=[{time:"2026-09-29T14:00:00Z",importance:"high",name:"JOLTS",countryCode:"US",forecast:7.106,previous:7.271},{time:"2026-09-30T12:30:00Z",importance:"high",name:"Core PCE m/m",countryCode:"US",forecast:0.2,previous:0.2},{time:"2026-10-02T12:30:00Z",importance:"high",name:"Nonfarm Payrolls",countryCode:"US",forecast:52,previous:162}];EVENTS=data.filter(e=>e.countryCode==="US"||/pce|payroll|jolts|claims|cpi/i.test(e.name||""));const now=Date.now();const focus=EVENTS.filter(e=>new Date(e.time)-now>-10*60*1000).sort((a,b)=>new Date(a.time)-new Date(b.time))[0]||EVENTS[0];if(focus){const b=surprise(focus.name,focus.actual,focus.forecast);document.getElementById("nextBox").innerHTML=`<b>${focus.name}</b><div class="nums">${fmtHM(new Date(focus.time))} ET · F ${focus.forecast??"—"}</div><div class="bias ${b.side}">MNQ ${b.side.toUpperCase()} · ${b.reason}</div>`;document.getElementById("banner").textContent=soundOn?("Som ON · "+focus.name):("Toque Ativar som · "+focus.name)}document.getElementById("cal").innerHTML=EVENTS.slice(0,20).map(e=>`<div class="row">${fmtHM(new Date(e.time))} · ${e.name} F ${e.forecast??"—"}</div>`).join("");document.getElementById("calStatus").textContent=EVENTS.length+" eventos"}
document.getElementById("btnSound").onclick=unlockSound;
document.getElementById("btnNews").onclick=loadNews;
document.getElementById("btnCal").onclick=loadCal;
document.getElementById("btnParse").onclick=()=>{const t=document.getElementById("paste").value.trim();if(!t)return;const b=headlineBias(t);document.getElementById("parseOut").innerHTML=`<div class="bias ${b.side}">${b.side} · ${b.reason}</div>`};
loadCal();loadNews();setInterval(loadCal,180000);setInterval(loadNews,180000);
if("serviceWorker" in navigator){navigator.serviceWorker.register("./sw.js").catch(function(){});}
</script></body></html>
